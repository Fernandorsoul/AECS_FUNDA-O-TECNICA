schema_version: aecs.task-contract/v1
task:
  id: H1-QUEUE
  objective: Replace the pending QueuePolicy implementation with the production queue declared by its contract
  acceptance:
    - QueuePolicy returns the production queue declared by QueueContract
  acceptance_evidence:
    - id: AC-001
      type: verifier
      reference: Build
  scope:
    allowed: [src/**]
    forbidden: [src/Policies/InvoicePolicy.cs, src/Policies/RetentionPolicy.cs]
  constraints:
    security_risk: low
    database_migration: false
    external_dependency: false
  budget:
    tokens: 8000
    usd: 0.10
    retries: 0
    wall_clock_seconds: 120
    max_files_changed: 1
  execution:
    runtime: host
    working_directory: .
    target: Benchmark.csproj
  verification:
    build: required
    unit_tests: disabled
    integration_tests: disabled
    scope: required
    security_scan: disabled
    architecture: disabled
    critical_semantic_failures: disabled
  approval:
    production: none

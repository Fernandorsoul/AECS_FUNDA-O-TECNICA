name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AECS.slnx

      - name: Build all projects
        run: dotnet build AECS.slnx --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test AECS.slnx --configuration Release --no-build --nologo

      - name: Smoke test CLI
        shell: bash
        run: |
          set +e
          output=$(dotnet run --project src/AECS.Cli/AECS.Cli.csproj --configuration Release --no-build -- run 2>&1)
          exit_code=$?
          set -e

          printf '%s\n' "$output"

          if [ "$exit_code" -ne 1 ]; then
            echo "Expected CLI usage failure exit code 1, received $exit_code."
            exit 1
          fi

          grep -q "Usage: aecs run" <<< "$output"

name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore AECS.slnx

      - name: Build all projects
        run: dotnet build AECS.slnx --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test AECS.slnx --configuration Release --no-build --nologo --filter "Category!=RealWorldE2E"

      - name: Reproducible AgronomoPlus E2E
        env:
          AECS_E2E_REPORT_PATH: ${{ runner.temp }}/aecs-real-world-e2e/report.json
        run: >-
          dotnet test tests/AECS.IntegrationTests/AECS.IntegrationTests.csproj
          --configuration Release
          --no-build
          --nologo
          --filter "Category=RealWorldE2E"

      - name: Publish AgronomoPlus E2E report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aecs-real-world-e2e
          path: ${{ runner.temp }}/aecs-real-world-e2e/
          if-no-files-found: error

      - name: Smoke test CLI
        shell: bash
        run: |
          set +e
          output=$(dotnet run --project src/AECS.Cli/AECS.Cli.csproj --configuration Release --no-build -- run 2>&1)
          exit_code=$?
          set -e

          printf '%s\n' "$output"

          if [ "$exit_code" -ne 1 ]; then
            echo "Expected CLI usage failure exit code 1, received $exit_code."
            exit 1
          fi

          grep -q "Usage: aecs run" <<< "$output"

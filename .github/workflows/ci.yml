name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AECS_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=aecs_test;Username=aecs

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aecs
          POSTGRES_DB: aecs_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aecs -d aecs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up Node.js for VS Code client
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json

      - name: Test VS Code client
        working-directory: clients/vscode
        run: |
          npm ci
          npm test

      - name: Test experiment SDK isolation
        shell: pwsh
        run: ./tests/scripts/Test-ExperimentToolchain.ps1

      - name: Restore
        run: dotnet restore AECS.slnx

      - name: Build all projects
        run: dotnet build AECS.slnx --configuration Release --no-restore --nologo

      - name: Test
        run: >-
          dotnet test AECS.slnx
          --configuration Release
          --no-build
          --nologo
          --filter "Category!=RealWorldE2E&Category!=PostgreSql&Category!=DockerSandbox"

      - name: Pull pinned staged sandbox image
        run: >-
          docker pull
          mcr.microsoft.com/dotnet/sdk:9.0@sha256:f190d2dd9eef2899c91ac323caa0bd2b39334a5400ba93013e5199da39dad940

      - name: Docker staged sandbox E2E
        env:
          AECS_RUN_DOCKER_E2E: "1"
        run: >-
          dotnet test tests/AECS.IntegrationTests/AECS.IntegrationTests.csproj
          --configuration Release
          --no-build
          --nologo
          --filter "Category=DockerSandbox"

      - name: PostgreSQL integration tests
        run: >-
          dotnet test tests/AECS.IntegrationTests/AECS.IntegrationTests.csproj
          --configuration Release
          --no-build
          --nologo
          --filter "Category=PostgreSql"

      - name: Context A/B benchmark guard
        shell: bash
        run: |
          benchmark_root="${RUNNER_TEMP}/context-compiler-h1-guard"
          cp -R experiments/context-compiler-h1/repository "${benchmark_root}"
          git -C "${benchmark_root}" init --initial-branch main
          git -C "${benchmark_root}" config user.name "AECS CI"
          git -C "${benchmark_root}" config user.email "aecs-ci@example.invalid"
          git -C "${benchmark_root}" add -A
          git -C "${benchmark_root}" commit -m "H1 benchmark baseline"
          dotnet build "${benchmark_root}/Benchmark.csproj" --configuration Release --nologo

          cp "${benchmark_root}/tasks/retention.yaml" "${benchmark_root}/src/Unexpected.txt"
          if dotnet build "${benchmark_root}/Benchmark.csproj" \
              --configuration Release --no-restore --nologo; then
            echo "Expected the benchmark guard to reject an untracked source file."
            exit 1
          fi

      - name: Experiment harness smoke dataset
        shell: bash
        run: |
          smoke_root="${RUNNER_TEMP}/aecs-experiment-smoke"
          output_root="${RUNNER_TEMP}/aecs-experiment-smoke-output"
          cp -R tests/fixtures/experiment-smoke "${smoke_root}"
          git -C "${smoke_root}/repository" init --initial-branch main
          git -C "${smoke_root}/repository" config user.name "AECS CI"
          git -C "${smoke_root}/repository" config user.email "aecs-ci@example.invalid"
          git -C "${smoke_root}/repository" add -A
          git -C "${smoke_root}/repository" commit -m "experiment smoke baseline"

          dotnet run --project src/AECS.Cli/AECS.Cli.csproj \
            --configuration Release --no-build -- \
            experiment \
            --dataset "${smoke_root}/dataset.json" \
            --output "${output_root}" \
            --allow-host-execution \
            --evidence-root "${RUNNER_TEMP}/aecs-experiment-smoke-evidence" \
            --key-directory "${RUNNER_TEMP}/aecs-experiment-smoke-keys"

          test -s "${output_root}/report.json"
          test -s "${output_root}/results.csv"
          test -s "${output_root}/comparisons.csv"
          test -s "${output_root}/analysis.csv"
          test -s "${output_root}/cost-records.csv"
          test -s "${output_root}/cost-efficiency.csv"
          test "$(find "${output_root}/runs" -name '*.json' | wc -l)" -eq 4
          grep -q '"schemaVersion": "aecs.experiment-report/v5"' "${output_root}/report.json"

          dotnet run --project src/AECS.Cli/AECS.Cli.csproj \
            --configuration Release --no-build -- \
            experiment \
            --dataset "${smoke_root}/dataset.json" \
            --output "${output_root}" \
            --resume \
            --allow-host-execution \
            --evidence-root "${RUNNER_TEMP}/aecs-experiment-smoke-evidence" \
            --key-directory "${RUNNER_TEMP}/aecs-experiment-smoke-keys"

          test "$(find "${output_root}/runs" -name '*.json' | wc -l)" -eq 4

      - name: Smoke test CLI
        shell: bash
        run: |
          set +e
          output=$(dotnet run --project src/AECS.Cli/AECS.Cli.csproj --configuration Release --no-build -- run 2>&1)
          exit_code=$?
          set -e

          printf '%s\n' "$output"

          if [ "$exit_code" -ne 1 ]; then
            echo "Expected CLI usage failure exit code 1, received $exit_code."
            exit 1
          fi

          grep -q "Usage: aecs run" <<< "$output"

          graph_output=$(dotnet run --project src/AECS.Cli/AECS.Cli.csproj \
            --configuration Release --no-build -- \
            evidence list \
            --repo "${GITHUB_WORKSPACE}" \
            --evidence-root "${RUNNER_TEMP}/empty-evidence" \
            --key-directory "${RUNNER_TEMP}/evidence-keys" \
            --format json)

          printf '%s\n' "$graph_output"
          grep -q '"items": \[\]' <<< "$graph_output"

          set +e
          postgres_output=$(env -u AECS_POSTGRES_CONNECTION_STRING \
            dotnet run --project src/AECS.Cli/AECS.Cli.csproj \
            --configuration Release --no-build -- \
            export-patch \
            --evidence 11111111-1111-1111-1111-111111111111 \
            --diff-hash sha256:test \
            --output "${RUNNER_TEMP}/must-not-exist.patch" \
            --actor ci \
            --evidence-store postgres 2>&1)
          postgres_exit_code=$?
          set -e

          printf '%s\n' "$postgres_output"

          if [ "$postgres_exit_code" -ne 1 ]; then
            echo "Expected missing PostgreSQL secret to fail with exit code 1."
            exit 1
          fi

          grep -q "requires the secret environment variable" <<< "$postgres_output"
          test ! -e "${RUNNER_TEMP}/must-not-exist.patch"

          vscode_token="ci-vscode-session-token-with-at-least-32-characters"
          vscode_request=$(printf '{"protocol":"aecs.vscode/v1","id":"ci-init","method":"initialize","token":"%s","parameters":{}}\n' "$vscode_token")
          vscode_output=$(printf '%s' "$vscode_request" | \
            AECS_VSCODE_SESSION_TOKEN="$vscode_token" \
            dotnet run --project src/AECS.Cli/AECS.Cli.csproj \
            --configuration Release --no-build -- \
            vscode-server \
            --repo "${GITHUB_WORKSPACE}" \
            --state-dir "${RUNNER_TEMP}/aecs-vscode-state" \
            --mock \
            --evidence-root "${RUNNER_TEMP}/aecs-vscode-evidence" \
            --key-directory "${RUNNER_TEMP}/aecs-vscode-keys")

          printf '%s\n' "$vscode_output"
          grep -q '"protocol":"aecs.vscode/v1"' <<< "$vscode_output"
          grep -q '"ok":true' <<< "$vscode_output"

          alert_output=$(printf 'alerts evaluate\nexit\n' | \
            dotnet run --project src/AECS.Cli/AECS.Cli.csproj \
            --configuration Release --no-build -- \
            jarvis \
            --repo "${GITHUB_WORKSPACE}" \
            --mock \
            --alert-policy "${GITHUB_WORKSPACE}/aecs.alert-policy.example.json" \
            --alert-root "${RUNNER_TEMP}/aecs-alerts-disabled")

          printf '%s\n' "$alert_output"
          grep -q 'Policy enabled: False' <<< "$alert_output"
          grep -q 'no evidence was evaluated and no sink was called' <<< "$alert_output"
          test ! -d "${RUNNER_TEMP}/aecs-alerts-disabled/inbox"

  real-world-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore E2E projects
        run: >-
          dotnet restore
          tests/AECS.IntegrationTests/AECS.IntegrationTests.csproj

      - name: Build E2E projects
        run: >-
          dotnet build
          tests/AECS.IntegrationTests/AECS.IntegrationTests.csproj
          --configuration Release
          --no-restore
          --nologo

      - name: Reproducible AgronomoPlus E2E
        env:
          AECS_E2E_REPORT_PATH: ${{ runner.temp }}/aecs-real-world-e2e/report.json
        run: >-
          dotnet test tests/AECS.IntegrationTests/AECS.IntegrationTests.csproj
          --configuration Release
          --no-build
          --nologo
          --filter "Category=RealWorldE2E"
          --blame-hang
          --blame-hang-timeout 5m
          --blame-hang-dump-type mini
          --results-directory "${RUNNER_TEMP}/aecs-real-world-e2e-diagnostics"

      - name: Publish AgronomoPlus E2E report, evidence and hang diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aecs-real-world-e2e
          path: |
            ${{ runner.temp }}/aecs-real-world-e2e/
            ${{ runner.temp }}/aecs-real-world-e2e-diagnostics/
          if-no-files-found: warn

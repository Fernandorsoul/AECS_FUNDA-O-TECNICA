name: Context Compiler H1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-context-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.AECS_EXPERIMENT_OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Require experiment credential
        shell: bash
        run: test -n "${OPENAI_API_KEY}"

      - name: Restore and build controller
        run: |
          dotnet restore AECS.slnx
          dotnet build AECS.slnx --configuration Release --no-restore --nologo

      - name: Prepare versioned benchmark baseline
        shell: bash
        run: |
          experiment_root="${RUNNER_TEMP}/context-compiler-h1"
          cp -R experiments/context-compiler-h1 "${experiment_root}"
          git -C "${experiment_root}/repository" init --initial-branch main
          git -C "${experiment_root}/repository" config user.name "AECS H1"
          git -C "${experiment_root}/repository" config user.email "h1@aecs.invalid"
          git -C "${experiment_root}/repository" add -A
          git -C "${experiment_root}/repository" commit -m "H1 benchmark baseline"

      - name: Run preregistered 30-pair experiment
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          dotnet run --project src/AECS.Cli/AECS.Cli.csproj \
            --configuration Release --no-build -- \
            experiment \
            --dataset "${RUNNER_TEMP}/context-compiler-h1/dataset.cloud.json" \
            --output "${RUNNER_TEMP}/context-compiler-h1-output" \
            --include-real-providers \
            --allow-host-execution \
            --evidence-root "${RUNNER_TEMP}/context-compiler-h1-evidence" \
            --key-directory "${RUNNER_TEMP}/context-compiler-h1-keys"

      - name: Validate complete preregistered sample
        if: always()
        shell: bash
        run: |
          output_root="${RUNNER_TEMP}/context-compiler-h1-output"
          evidence_root="${RUNNER_TEMP}/context-compiler-h1-evidence"

          test -s "${output_root}/report.json"
          test -s "${output_root}/results.csv"
          test -s "${output_root}/comparisons.csv"
          test -s "${output_root}/analysis.csv"
          test -s "${output_root}/cost-records.csv"
          test -s "${output_root}/cost-efficiency.csv"
          test "$(find "${output_root}/runs" -type f -name '*.json' | wc -l)" -eq 60
          test "$(find "${evidence_root}" -type f -name '*.json' | wc -l)" -eq 60

          jq -e '
            .schemaVersion == "aecs.experiment-report/v3" and
            .totalTasks == 60 and
            (.results | length) == 60 and
            (.pairedComparisons | length) == 30 and
            ((.completedCount + .failedCount + .skippedCount) == 60)
          ' "${output_root}/report.json" > /dev/null

          find "${output_root}/runs" -type f -name '*.json' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "${RUNNER_TEMP}/context-compiler-h1-checkpoints-before.sha256"
          find "${evidence_root}" -type f -name '*.json' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "${RUNNER_TEMP}/context-compiler-h1-evidence-before.sha256"

      - name: Prove resume is checkpoint-only
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          dotnet run --project src/AECS.Cli/AECS.Cli.csproj \
            --configuration Release --no-build -- \
            experiment \
            --dataset "${RUNNER_TEMP}/context-compiler-h1/dataset.cloud.json" \
            --output "${RUNNER_TEMP}/context-compiler-h1-output" \
            --resume \
            --include-real-providers \
            --allow-host-execution \
            --evidence-root "${RUNNER_TEMP}/context-compiler-h1-evidence" \
            --key-directory "${RUNNER_TEMP}/context-compiler-h1-keys"

      - name: Validate immutable resume and write checksums
        shell: bash
        run: |
          output_root="${RUNNER_TEMP}/context-compiler-h1-output"
          evidence_root="${RUNNER_TEMP}/context-compiler-h1-evidence"
          key_root="${RUNNER_TEMP}/context-compiler-h1-keys"

          find "${output_root}/runs" -type f -name '*.json' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "${RUNNER_TEMP}/context-compiler-h1-checkpoints-after.sha256"
          find "${evidence_root}" -type f -name '*.json' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "${RUNNER_TEMP}/context-compiler-h1-evidence-after.sha256"

          diff --unified \
            "${RUNNER_TEMP}/context-compiler-h1-checkpoints-before.sha256" \
            "${RUNNER_TEMP}/context-compiler-h1-checkpoints-after.sha256"
          diff --unified \
            "${RUNNER_TEMP}/context-compiler-h1-evidence-before.sha256" \
            "${RUNNER_TEMP}/context-compiler-h1-evidence-after.sha256"

          manifest="${RUNNER_TEMP}/context-compiler-h1-checksums.sha256"
          (
            cd "${RUNNER_TEMP}"
            find \
              context-compiler-h1-output \
              context-compiler-h1-evidence \
              context-compiler-h1-keys \
              -type f \
              ! -name '*private*' \
              ! -name 'checksums.sha256' \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > "${manifest}"
          mv "${manifest}" "${output_root}/checksums.sha256"

          find "${key_root}" -type f -name '*private*' -delete
          test -z "$(find "${key_root}" -type f -name '*private*' -print -quit)"

      - name: Publish report and authenticated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-compiler-h1-${{ github.sha }}
          path: |
            ${{ runner.temp }}/context-compiler-h1-output/
            ${{ runner.temp }}/context-compiler-h1-evidence/
            ${{ runner.temp }}/context-compiler-h1-keys/*.public.pem
          if-no-files-found: error
          retention-days: 30

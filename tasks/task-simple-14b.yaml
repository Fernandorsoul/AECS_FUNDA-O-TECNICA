task:
  id: SIMPLE-001
  objective: Add a static method called IsValidEmail to the Customer class that returns true if the email contains an @ character
  acceptance:
    - Customer.IsValidEmail returns true for "test@example.com"
    - Customer.IsValidEmail returns false for "invalid"
  scope:
    allowed:
      - src/Customers/**
    forbidden: []
  constraints:
    security_risk: low
    database_migration: false
    external_dependency: false
  budget:
    tokens: 80000
    usd: 0.50
    retries: 2
    wall_clock_seconds: 300
    max_files_changed: 3
  verification:
    build: required
    unit_tests: required
    scope: required
  approval:
    production: none

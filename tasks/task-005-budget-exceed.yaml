schema_version: aecs.task-contract/v1
task:
  id: TASK-005
  objective: Refactor the entire Customers module including all services, repositories, mappers, DTOs, and tests to use a new pattern
  acceptance:
    - All files use new pattern
    - Tests pass
  scope:
    allowed:
      - src/Customers/**
      - tests/Customers/**
    forbidden:
      - src/Billing/**
      - src/Orders/**
  constraints:
    security_risk: low
    database_migration: false
    external_dependency: false
  budget:
    tokens: 60000
    usd: 0.20
    retries: 1
    wall_clock_seconds: 120
    max_files_changed: 2
  verification:
    build: required
    unit_tests: required
    scope: required
    integration_tests: optional
    security_scan: optional
    architecture: optional
  approval:
    production: none

task:
  id: R3-001
  objective: Implement a secure password hashing service using BCrypt with salt generation, hash verification, and configurable work factor. Add it to the Customers module with proper dependency injection.
  acceptance:
    - PasswordHasher.HashPassword returns a BCrypt hash
    - PasswordHasher.VerifyPassword returns true for matching password
    - PasswordHasher.VerifyPassword returns false for wrong password
    - Work factor is configurable via constructor
    - Service is registered for dependency injection
    - All existing tests pass
  scope:
    allowed:
      - src/Customers/**
      - tests/Customers/**
    forbidden:
      - src/Billing/**
      - src/Orders/**
  constraints:
    security_risk: high
    database_migration: false
    external_dependency: true
  budget:
    tokens: 120000
    usd: 1.00
    retries: 3
    wall_clock_seconds: 300
    max_files_changed: 5
  verification:
    build: required
    unit_tests: required
    scope: required
    budget: required
    security_scan: optional
  approval:
    production: human

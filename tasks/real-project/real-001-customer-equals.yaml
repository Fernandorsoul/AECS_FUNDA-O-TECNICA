schema_version: aecs.task-contract/v1
task:
  id: REAL-001
  objective: Fix Customer.Equals to handle null input without throwing NullReferenceException. It should return false when compared to null.
  acceptance:
    - Customer.Equals(null) returns false
    - Customer.Equals(sameCustomer) returns true
    - All CustomerTests pass
  scope:
    allowed:
      - src/RealProject/Customers/**
      - tests/RealProject.Tests/Customers/**
    forbidden:
      - src/RealProject/Orders/**
      - src/RealProject/Billing/**
  constraints:
    security_risk: low
    database_migration: false
    external_dependency: false
  execution:
    working_directory: sample/RealProject
    target: RealProject.slnx
    sandbox:
      network_access: true
    capabilities:
      network:
        destinations:
          - "api.nuget.org"
          - "nuget.org"
        phases:
          - "baseline.build"
          - "candidate.build"
          - "baseline.test"
          - "candidate.test"
      resources:
        wall_clock_seconds: 300
  budget:
    tokens: 80000
    usd: 0.30
    retries: 2
    wall_clock_seconds: 180
    max_files_changed: 3
  verification:
    build: required
    unit_tests: required
    scope: required
  approval:
    production: none

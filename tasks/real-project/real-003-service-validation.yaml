schema_version: aecs.task-contract/v1
task:
  id: REAL-003
  objective: "Add input validation to CustomerService.Create: reject null name, empty email, and invalid email format. Fix GetActive to return only active customers. Fix Deactivate to throw InvalidOperationException for non-existing customer."
  acceptance:
    - Create(null, email) throws ArgumentException
    - Create(name, "") throws ArgumentException
    - Create(name, "invalid") throws ArgumentException
    - GetActive returns only active customers
    - Deactivate(999) throws InvalidOperationException
    - All CustomerServiceTests pass
  scope:
    allowed:
      - sample/RealProject/src/RealProject/Customers/**
      - sample/RealProject/tests/RealProject.Tests/Customers/**
    forbidden:
      - sample/RealProject/src/RealProject/Orders/**
      - sample/RealProject/src/RealProject/Billing/**
  constraints:
    security_risk: low
    database_migration: false
    external_dependency: false
  execution:
    working_directory: sample/RealProject
    target: RealProject.slnx
    runtime: host
    capabilities:
      file_system:
        read:
          - "**"
        write:
          - "**/bin/**"
          - "**/obj/**"
          - ".aecs-verification/**"
      processes:
        - executable: "git"
          argument_prefix: ["--version"]
          phases: ["baseline.tool-probe"]
        - executable: "dotnet"
          argument_prefix: ["--version"]
          phases: ["baseline.tool-probe"]
        - executable: "dotnet"
          argument_prefix: ["build"]
          phases: ["baseline.build", "candidate.build"]
        - executable: "dotnet"
          argument_prefix: ["test"]
          phases: ["baseline.test", "candidate.test", "candidate.acceptance"]
        - executable: "dotnet"
          argument_prefix: ["list"]
          phases: ["baseline.security-scan", "candidate.security-scan"]
      network:
        destinations: []
        phases: []
      resources:
        wall_clock_seconds: 300
  budget:
    tokens: 100000
    usd: 0.50
    retries: 2
    wall_clock_seconds: 240
    max_files_changed: 3
  verification:
    build: required
    unit_tests: required
    scope: required
  approval:
    production: none

schema_version: aecs.task-contract/v1
task:
  id: REAL-003
  objective: "Add input validation to CustomerService.Create: reject null name, empty email, and invalid email format. Fix GetActive to return only active customers. Fix Deactivate to throw InvalidOperationException for non-existing customer."
  acceptance:
    - Create(null, email) throws ArgumentException
    - Create(name, "") throws ArgumentException
    - Create(name, "invalid") throws ArgumentException
    - GetActive returns only active customers
    - Deactivate(999) throws InvalidOperationException
    - All CustomerServiceTests pass
  scope:
    allowed:
      - src/RealProject/Customers/**
      - tests/RealProject.Tests/Customers/**
    forbidden:
      - src/RealProject/Orders/**
      - src/RealProject/Billing/**
  constraints:
    security_risk: low
    database_migration: false
    external_dependency: false
  execution:
    working_directory: sample/RealProject
    target: RealProject.slnx
    sandbox:
      network_access: true
    capabilities:
      network:
        destinations:
          - "api.nuget.org"
          - "nuget.org"
        phases:
          - "baseline.build"
          - "candidate.build"
          - "baseline.test"
          - "candidate.test"
      resources:
        wall_clock_seconds: 300
  budget:
    tokens: 100000
    usd: 0.50
    retries: 2
    wall_clock_seconds: 240
    max_files_changed: 3
  verification:
    build: required
    unit_tests: required
    scope: required
  approval:
    production: none

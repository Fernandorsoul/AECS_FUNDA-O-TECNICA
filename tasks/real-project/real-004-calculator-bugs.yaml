      - tests/RealProject.Tests/Orders/**
    forbidden:
      - src/RealProject/Customers/**
      - src/RealProject/Billing/**
  constraints:
    security_risk: low
    database_migration: false
    external_dependency: false
  budget:
    tokens: 80000
    usd: 0.30
    retries: 2
    wall_clock_seconds: 180
    max_files_changed: 3
  verification:
    build: required
    unit_tests: required
    scope: required
    budget: required
  approval:
    production: none

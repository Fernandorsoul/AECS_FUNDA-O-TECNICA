schema_version: aecs.task-contract/v1
task:
  id: REAL-004
  objective: "Fix OrderCalculator bugs: ApplyDiscount should reject discount > 100 (off-by-one error), CalculateTax should reject negative tax rate, CalculateTotal should handle empty items list."
  acceptance:
    - ApplyDiscount(100, 101) throws ArgumentOutOfRangeException
    - ApplyDiscount(100, 100) returns 0
    - CalculateTax(100, -0.05) throws ArgumentOutOfRangeException
    - CalculateTotal with empty items returns 0
    - All OrderCalculatorTests pass
  scope:
    allowed:
      - src/RealProject/Orders/**
      - tests/RealProject.Tests/Orders/**
    forbidden:
      - src/RealProject/Customers/**
      - src/RealProject/Billing/**
  constraints:
    security_risk: low
    database_migration: false
    external_dependency: false
  execution:
    working_directory: sample/RealProject
    target: RealProject.slnx
    sandbox:
      network_access: true
    capabilities:
      file_system:
        read:
          - "**"
        write:
          - "**/bin/**"
          - "**/obj/**"
          - ".aecs-verification/**"
      processes:
        - executable: "git"
          argument_prefix: ["--version"]
          phases: ["baseline.tool-probe"]
        - executable: "dotnet"
          argument_prefix: ["--version"]
          phases: ["baseline.tool-probe"]
        - executable: "dotnet"
          argument_prefix: ["build"]
          phases: ["baseline.build", "candidate.build"]
        - executable: "dotnet"
          argument_prefix: ["test"]
          phases: ["baseline.test", "candidate.test", "candidate.acceptance"]
        - executable: "dotnet"
          argument_prefix: ["list"]
          phases: ["baseline.security-scan", "candidate.security-scan"]
      network:
        destinations:
          - "api.nuget.org"
          - "nuget.org"
        phases:
          - "baseline.build"
          - "candidate.build"
          - "baseline.test"
          - "candidate.test"
      resources:
        wall_clock_seconds: 300
  budget:
    tokens: 80000
    usd: 0.30
    retries: 2
    wall_clock_seconds: 180
    max_files_changed: 3
  verification:
    build: required
    unit_tests: required
    scope: required
  approval:
    production: none

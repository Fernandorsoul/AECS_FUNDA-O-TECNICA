schema_version: aecs.task-contract/v1
task:
  id: TASK-001
  objective: Fix NullReferenceException in CustomerMapper when input is null
  acceptance:
    - No NullReferenceException when Customer is null
    - Existing tests still pass
    - Null input returns empty result instead of throwing
  acceptance_evidence:
    - id: AC-001
      type: test
      reference: "FullyQualifiedName~CustomerMapperTests"
      test_path: sample/SampleProject/tests/SampleProject.Tests/Customers/CustomerMapperTests.cs
      required: true
    - id: AC-002
      type: test
      reference: "FullyQualifiedName~SampleProject.Tests"
      test_path: sample/SampleProject/tests/SampleProject.Tests/Customers/CustomerMapperTests.cs
      required: true
    - id: AC-003
      type: test
      reference: "FullyQualifiedName~CustomerMapperTests"
      test_path: sample/SampleProject/tests/SampleProject.Tests/Customers/CustomerMapperTests.cs
      required: true
  scope:
    allowed:
      - sample/SampleProject/src/SampleProject/Customers/**
      - sample/SampleProject/tests/SampleProject.Tests/Customers/**
    forbidden:
      - sample/SampleProject/src/SampleProject/Billing/**
      - sample/SampleProject/src/SampleProject/Orders/**
  constraints:
    security_risk: low
    database_migration: false
    external_dependency: false
  execution:
    working_directory: sample/SampleProject
    target: SampleProject.slnx
    runtime: docker
    test_suites:
      unit:
        mode: required
        target: tests/SampleProject.Tests/SampleProject.Tests.csproj
      acceptance:
        mode: required
        target: tests/SampleProject.Tests/SampleProject.Tests.csproj
    sandbox:
      network_access: true
      cpu_limit: "2.0"
      memory_limit: "1g"
      process_limit: 256
      wall_clock_seconds: 300
    capabilities:
      file_system:
        read:
          - "**"
        write:
          - "**/bin/**"
          - "**/obj/**"
      processes:
        - executable: git
          argument_prefix: ["--version"]
          phases: ["baseline.tool-probe"]
        - executable: dotnet
          argument_prefix: ["--version"]
          phases: ["baseline.tool-probe"]
        - executable: dotnet
          argument_prefix: ["build"]
          phases: ["baseline.build", "candidate.build"]
        - executable: dotnet
          argument_prefix: ["test"]
          phases: ["baseline.test", "candidate.test", "baseline.unit-test", "candidate.unit-test", "candidate.acceptance"]
        - executable: dotnet
          argument_prefix: ["list"]
          phases: ["baseline.security-scan", "candidate.security-scan"]
      network:
        destinations:
          - "*"
        phases:
          - baseline.tool-probe
          - baseline.build
          - candidate.build
          - baseline.test
          - candidate.test
          - baseline.unit-test
          - candidate.unit-test
          - candidate.acceptance
      resources:
        cpu_limit: "2.0"
        memory_limit: "1g"
        process_limit: 256
        wall_clock_seconds: 300
  budget:
    tokens: 60000
    usd: 0.20
    retries: 1
    wall_clock_seconds: 600
    max_files_changed: 5
  verification:
    build: required
    unit_tests: required
    scope: required
    integration_tests: optional
    security_scan: optional
    architecture: optional
    critical_semantic_failures: optional
  approval:
    production: none

schema_version: aecs.task-contract/v1
task:
  id: TASK-001
  objective: Fix NullReferenceException in CustomerMapper when input is null
  acceptance:
    - No NullReferenceException when Customer is null
    - Existing tests still pass
    - Null input returns empty result instead of throwing
  scope:
    allowed:
      - src/SampleProject/Customers/**
      - tests/SampleProject.Tests/Customers/**
    forbidden:
      - src/SampleProject/Billing/**
      - src/SampleProject/Orders/**
  constraints:
    security_risk: low
    database_migration: false
    external_dependency: false
  execution:
    working_directory: .
    target: SampleProject.slnx
    runtime: docker
  budget:
    tokens: 60000
    usd: 0.20
    retries: 1
    wall_clock_seconds: 120
    max_files_changed: 5
  verification:
    build: required
    unit_tests: required
    scope: required
    integration_tests: optional
    security_scan: optional
    architecture: optional
  approval:
    production: none

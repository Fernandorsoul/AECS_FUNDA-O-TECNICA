schema_version: aecs.task-contract/v1
task:
  id: R4-001
  objective: Create a Docker Compose configuration for the SampleProject with PostgreSQL database, API service, and health checks
  acceptance:
    - docker-compose.yml defines postgres service
    - docker-compose.yml defines api service
    - Health checks are configured for both services
    - Environment variables are used for database connection
    - Volumes are configured for data persistence
  scope:
    allowed:
      - docker-compose.yml
      - Dockerfile
      - .env.example
    forbidden:
      - src/**
      - tests/**
  constraints:
    security_risk: high
    database_migration: false
    external_dependency: true
  budget:
    tokens: 120000
    usd: 1.00
    retries: 2
    wall_clock_seconds: 300
    max_files_changed: 5
  verification:
    build: optional
    unit_tests: optional
    scope: required
  approval:
    production: human
